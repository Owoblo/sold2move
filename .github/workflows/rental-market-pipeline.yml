name: Rental Market Pipeline

on:
  schedule:
    - cron: '30 16 */2 * *'
  workflow_dispatch:

concurrency:
  group: rental-market-pipeline
  cancel-in-progress: false

jobs:
  scrape-diff-report:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Validate lifecycle logic
        run: node scripts/test-market-lifecycle.cjs && node scripts/test-rental-market-lib.cjs
      - name: Apply rental lifecycle schema
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node scripts/apply-supabase-migration.cjs supabase/migrations/20260723_rental_market_hub.sql
          node scripts/apply-supabase-migration.cjs supabase/migrations/20260730_market_inventory_lifecycle.sql
      - name: Scrape and categorize rental inventory
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/rental-pipeline.cjs
      - name: Persist and diff rental inventory
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/load-rental-snapshot.cjs
      - name: Email rental report
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MARKET_REPORT_EMAIL: business@starmovers.ca
        run: |
          RUN_ID=$(head -1 scripts/.pipeline-rentals/latest-run.txt)
          node scripts/market-email-results.cjs rental "scripts/.pipeline-rentals/$RUN_ID"
      - name: Upload rental audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rental-market-${{ github.run_id }}
          path: scripts/.pipeline-rentals/
          if-no-files-found: warn
          retention-days: 30
