name: Rental Market Pipeline

on:
  schedule:
    - cron: '30 16 * * 2'
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate code, database access and schema without paid acquisition or emails
        type: boolean
        default: false
      report_only:
        description: Email the saved rental report without scraping, classification or batch generation
        type: boolean
        default: false
      source_run_id:
        description: Resume a saved rental scrape from this workflow run; leave blank for fresh acquisition
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: rental-market-pipeline
  cancel-in-progress: false

jobs:
  scrape-diff-report:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Validate lifecycle logic
        run: node scripts/test-market-lifecycle.cjs && node scripts/test-rental-market-lib.cjs && node scripts/test-rental-campaign.cjs && node scripts/test-rental-screening.cjs && node scripts/test-rental-email.cjs && node scripts/test-rental-address.cjs
      - name: Verify database access before acquisition
        if: inputs.report_only != true
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/market-db.cjs
      - name: Apply rental lifecycle schema
        if: inputs.report_only != true
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node scripts/apply-supabase-migration.cjs supabase/migrations/20260723_rental_market_hub.sql
          node scripts/apply-supabase-migration.cjs supabase/migrations/20260730_market_inventory_lifecycle.sql
          node scripts/apply-supabase-migration.cjs supabase/migrations/20260730_market_ai_classification.sql
          node scripts/apply-supabase-migration.cjs supabase/migrations/20260730_market_acquisition_scope.sql
          node scripts/apply-supabase-migration.cjs supabase/migrations/20260905_rental_occupant_campaign.sql
          node scripts/apply-supabase-migration.cjs supabase/migrations/20260905_rental_import_chunks.sql
      - name: Verify rental persistence against temporary schema tables
        if: inputs.report_only != true
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/test-rental-loader.cjs --database
      - name: Validate report-only input
        if: inputs.report_only == true
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: '[[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]'
      - name: Restore saved rental acquisition
        if: inputs.validate_only != true && inputs.source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh run download "$SOURCE_RUN_ID" --pattern 'rental-market-*' --dir rental-resume-source
          node scripts/rental-resume.cjs
      - name: Scrape and categorize rental inventory
        if: inputs.validate_only != true && inputs.report_only != true && inputs.source_run_id == ''
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/rental-pipeline.cjs
      - name: Persist and diff rental inventory
        if: inputs.validate_only != true && inputs.report_only != true
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/load-rental-snapshot.cjs
      - name: Fetch fresh details for new occupant candidates
        if: inputs.validate_only != true && inputs.report_only != true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          RUN_ID=$(head -1 scripts/.pipeline-rentals/latest-run.txt)
          node scripts/rental-enrich.cjs "scripts/.pipeline-rentals/$RUN_ID"
      - name: Classify current rental occupancy
        if: inputs.validate_only != true && inputs.report_only != true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          RUN_ID=$(head -1 scripts/.pipeline-rentals/latest-run.txt)
          node scripts/rental-classify.cjs "scripts/.pipeline-rentals/$RUN_ID"
      - name: Generate saved current-occupant rental batch
        if: inputs.validate_only != true && inputs.report_only != true
        env:
          RENTAL_BATCH_SUPPLEMENT: ${{ inputs.source_run_id }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          RUN_ID=$(head -1 scripts/.pipeline-rentals/latest-run.txt)
          node scripts/rental-postcards.cjs "scripts/.pipeline-rentals/$RUN_ID"
      - name: Email rental report
        if: inputs.validate_only != true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MARKET_REPORT_EMAIL: business@starmovers.ca
        run: |
          RUN_ID=$(head -1 scripts/.pipeline-rentals/latest-run.txt)
          node scripts/market-email-results.cjs rental "scripts/.pipeline-rentals/$RUN_ID"
      - name: Report rental acquisition costs
        if: always() && inputs.validate_only != true && inputs.report_only != true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/postcard-cost-report.cjs --email
      - name: Upload rental audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rental-market-${{ github.run_id }}
          path: |
            scripts/.pipeline-rentals/
            reports/apify-costs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
