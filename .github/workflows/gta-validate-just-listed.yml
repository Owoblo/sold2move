name: GTA Just Listed Qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gta-just-listed-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: node scripts/gta-validate-just-listed.cjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GTA_JUST_LISTED_1: ${{ secrets.GTA_JUST_LISTED_1 }}
          GTA_JUST_LISTED_2: ${{ secrets.GTA_JUST_LISTED_2 }}
          GTA_JUST_LISTED_3: ${{ secrets.GTA_JUST_LISTED_3 }}
          GTA_JUST_LISTED_4: ${{ secrets.GTA_JUST_LISTED_4 }}
          GTA_JUST_LISTED_5: ${{ secrets.GTA_JUST_LISTED_5 }}
          GTA_JUST_LISTED_6: ${{ secrets.GTA_JUST_LISTED_6 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gta-just-listed-${{ github.run_id }}
          path: reports/gta-just-listed-validation/
          retention-days: 30
