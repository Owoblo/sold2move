name: Commercial Market Pipeline

on:
  # Manual-only while residential is prioritized and these campaigns are refined.
  workflow_dispatch:
    inputs:
      validate_only:
        type: boolean
        default: false
      source_run_id:
        description: Restore a saved acquisition (no new inventory scrape)
        type: string
      initial_campaign:
        description: Review all currently occupied qualifying premises for first campaign
        type: boolean
        default: false
      pilot_run_id:
        type: string
      detail_pilot_run_id:
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: commercial-market-pipeline
  cancel-in-progress: false

jobs:
  scrape-diff-report:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Validate lifecycle logic
        run: node scripts/test-market-lifecycle.cjs && node scripts/test-commercial-market-lib.cjs && node scripts/test-commercial-outreach.cjs && node scripts/test-commercial-classify.cjs && node scripts/test-commercial-loader.cjs && node scripts/test-postcard-cost-report.cjs
      - name: Apply commercial lifecycle schema
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node scripts/apply-supabase-migration.cjs supabase/migrations/20260723_commercial_market_hub.sql
          node scripts/apply-supabase-migration.cjs supabase/migrations/20260730_market_inventory_lifecycle.sql
          node scripts/apply-supabase-migration.cjs supabase/migrations/20260730_market_ai_classification.sql
          node scripts/apply-supabase-migration.cjs supabase/migrations/20260730_market_acquisition_scope.sql
          node scripts/apply-supabase-migration.cjs supabase/migrations/20260815_commercial_relocation_engine.sql
          node scripts/apply-supabase-migration.cjs supabase/migrations/20260815_commercial_transition_ai_v2.sql
          node scripts/apply-supabase-migration.cjs supabase/migrations/20260905_commercial_campaign.sql
          node scripts/test-commercial-loader.cjs --database
      - name: Restore saved commercial acquisition
        if: inputs.validate_only != true && inputs.source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh run download "$SOURCE_RUN_ID" --pattern 'commercial-market-*' --dir commercial-resume-source
          node scripts/commercial-resume.cjs
      - name: Scrape and categorize commercial inventory
        if: inputs.validate_only != true && inputs.source_run_id == ''
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          COMMERCIAL_PILOT_RUN_ID: ${{ inputs.pilot_run_id }}
        run: node scripts/commercial-pipeline.cjs
      - name: Persist and diff commercial inventory
        if: inputs.validate_only != true
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/load-commercial-snapshot.cjs
      - name: Fetch commercial listing details with cache
        if: inputs.validate_only != true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          COMMERCIAL_DETAIL_PILOT_RUN_ID: ${{ inputs.detail_pilot_run_id }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          RUN_ID=$(head -1 scripts/.pipeline-commercial/latest-run.txt)
          node scripts/commercial-enrich.cjs "scripts/.pipeline-commercial/$RUN_ID"
      - name: Classify commercial occupancy from photos and descriptions
        if: inputs.validate_only != true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          RUN_ID=$(head -1 scripts/.pipeline-commercial/latest-run.txt)
          node scripts/commercial-classify.cjs "scripts/.pipeline-commercial/$RUN_ID"
      - name: Generate saved commercial review batch
        if: inputs.validate_only != true
        env:
          COMMERCIAL_INITIAL_CAMPAIGN: ${{ inputs.initial_campaign }}
          COMMERCIAL_BATCH_SUPPLEMENT: ${{ inputs.source_run_id }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          RUN_ID=$(head -1 scripts/.pipeline-commercial/latest-run.txt)
          node scripts/commercial-postcards.cjs "scripts/.pipeline-commercial/$RUN_ID"
      - name: Email commercial report
        if: inputs.validate_only != true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MARKET_REPORT_EMAIL: business@starmovers.ca
        run: |
          RUN_ID=$(head -1 scripts/.pipeline-commercial/latest-run.txt)
          node scripts/commercial-email-report.cjs "scripts/.pipeline-commercial/$RUN_ID"
      - name: Report commercial acquisition costs
        if: always() && inputs.validate_only != true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/postcard-cost-report.cjs --email
      - name: Upload commercial audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-market-${{ github.run_id }}
          path: |
            scripts/.pipeline-commercial/
            reports/apify-costs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
