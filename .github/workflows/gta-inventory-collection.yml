name: GTA Inventory Collection — Printing Held

on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:
    inputs:
      send_report:
        description: 'Send the inventory/change report to business@starmovers.ca only'
        type: boolean
        default: true
      recover_github_run_id:
        description: 'Optional failed GTA collection run to reuse (dataset must be under 24 hours old)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: gta-inventory-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Verify collection boundaries
        run: node --test scripts/test-gta-collection.cjs scripts/test-gta-listing-age.cjs
      - name: Recover preserved raw data without another scrape
        if: ${{ inputs.recover_github_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.recover_github_run_id }}
          pattern: gta-inventory-*
          merge-multiple: true
          path: scripts/.gta-recovery/
      - name: Collect fresh inventory and preserve baseline
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GTA_RECOVER_RAW_FILE: ${{ inputs.recover_github_run_id != '' && 'scripts/.gta-recovery/raw.json' || '' }}
        run: node scripts/gta-collection.cjs
      - name: Email owner-only inventory and change report
        if: ${{ github.event_name == 'schedule' || inputs.send_report }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/gta-email-results.cjs
      - name: Save inventory and quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: scripts/.gta-census/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
