name: Postcard inventory scrape — all areas
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: postcard-pipeline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Scrape all seven regions and update listing lifecycle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/postcard-scrape-all.cjs
      - name: Save regional scrape results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postcard-inventory-scrape-${{ github.run_id }}
          path: |
            reports/local-scrape-*/
            scripts/.pipeline-*/batches/*/step0-current.json
          retention-days: 30
