name: Refresh partner event connections
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Save internal connections and paused discoveries (never sends outreach)
        type: boolean
        default: false
  workflow_run:
    workflows:
      - Postcard inventory scrape — all areas
      - GTA Collection and Existing Postcard Pipeline
      - Postcard Pipeline — Ottawa Only
      - Postcard Pipeline — Core Regions (Windsor · Chatham · Sarnia · London · Woodstock · WKG)
    types: [completed]
permissions:
  contents: read
concurrency:
  group: partner-event-inventory-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Refresh from stored inventory
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPLY: ${{ github.event_name == 'workflow_run' || inputs.apply }}
          PARTNER_EVENT_REPORT: partner-event-refresh.json
        run: |
          if [ "$APPLY" = "true" ]; then
            node scripts/refresh-partner-listing-inventory.cjs --apply
          else
            node scripts/refresh-partner-listing-inventory.cjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partner-event-refresh
          path: partner-event-refresh.json
