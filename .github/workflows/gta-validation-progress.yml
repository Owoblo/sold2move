name: GTA Validation Progress
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read current detail scraper progress
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          async function get(endpoint){const r=await fetch('https://api.apify.com/v2/'+endpoint,{headers:{Authorization:'Bearer '+process.env.APIFY_TOKEN}});if(!r.ok)throw Error('HTTP '+r.status);return r.json();}
          (async()=>{const r=await get('acts/maxcopell~zillow-detail-scraper/runs?desc=1&limit=30');const result=[];for(const run of r.data.items.filter(r=>Date.now()-Date.parse(r.startedAt)<6*3600000)){const dataset=await get('datasets/'+run.defaultDatasetId);result.push({id:run.id,status:run.status,started_at:run.startedAt,items:dataset.data.itemCount,status_message:run.statusMessage,dataset:run.defaultDatasetId});}fs.writeFileSync('progress.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));})().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: gta-validation-progress-${{ github.run_id }}
          path: progress.json
